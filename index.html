
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 Cosmic Star Chaser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            background: #0a0a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameContainer {
            background: #0d0d3b;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 50px rgba(100, 100, 255, 0.3);
            border: 2px solid #4444aa;
            max-width: 100vw;
            max-height: 100vh;
        }
        
        canvas {
            display: block;
            border-radius: 10px;
            background: #0a0a2a;
            touch-action: none;
            width: 100%;
            height: auto;
            max-width: 800px;
            max-height: 600px;
        }
        
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
            width: 90%;
            max-width: 600px;
        }
        
        #ui.active {
            pointer-events: auto;
        }
        
        .title {
            color: #ffd700;
            font-size: clamp(28px, 6vw, 48px);
            text-shadow: 0 0 20px #ffd700, 0 0 40px #ff8c00;
            animation: glow 2s ease-in-out infinite;
        }
        
        .subtitle {
            color: #00ffff;
            font-size: clamp(16px, 3vw, 24px);
            margin-top: 10px;
        }
        
        .input-box {
            background: rgba(50, 50, 100, 0.8);
            border: 2px solid #ffffff;
            padding: 12px 20px;
            border-radius: 10px;
            color: white;
            font-size: clamp(16px, 2.5vw, 20px);
            margin: 8px;
            min-width: 200px;
            pointer-events: auto;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }
        
        .input-box:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .input-box.active {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .input-box.error {
            border-color: #ff0000;
        }
        
        .error-text {
            color: #ff0000;
            font-size: clamp(14px, 2vw, 18px);
            margin-top: 5px;
            min-height: 25px;
        }
        
        .btn {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            color: #000;
            font-size: clamp(18px, 2.5vw, 24px);
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.3s;
            margin: 10px;
            touch-action: manipulation;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .age-requirement {
            color: #ffff00;
            font-size: clamp(14px, 2vw, 18px);
            margin: 10px 0;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ff8c00; }
            50% { text-shadow: 0 0 30px #ffd700, 0 0 60px #ff8c00, 0 0 80px #ff4500; }
        }
        
        #gameOver {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
            border-radius: 10px;
            padding: 20px;
        }
        
        #gameOver.show {
            display: flex;
        }
        
        .game-over-title {
            color: #ff3333;
            font-size: clamp(32px, 6vw, 48px);
            text-shadow: 0 0 20px #ff0000;
        }
        
        .win-title {
            color: #ffd700;
            font-size: clamp(32px, 6vw, 48px);
            text-shadow: 0 0 20px #ffd700;
        }
        
        .final-score {
            color: white;
            font-size: clamp(20px, 3vw, 28px);
            margin: 20px 0;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* Mobile controls */
        #mobileControls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            z-index: 15;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
        }
        
        #mobileControls.show {
            display: flex;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            touch-action: none;
            backdrop-filter: blur(5px);
        }
        
        .control-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.9);
        }
        
        .dpad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 5px;
            pointer-events: none;
        }
        
        .dpad-btn {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            touch-action: none;
            backdrop-filter: blur(5px);
            cursor: pointer;
        }
        
        .dpad-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.9);
        }
        
        .dpad-empty {
            visibility: hidden;
        }
        
        /* Responsive */
        @media (max-width: 850px) {
            #gameContainer {
                padding: 10px;
                border-radius: 10px;
            }
            canvas {
                border-radius: 5px;
            }
            #mobileControls.show {
                display: flex;
            }
            .dpad-btn, .control-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
            .dpad {
                grid-template-columns: 50px 50px 50px;
                grid-template-rows: 50px 50px 50px;
                gap: 4px;
            }
        }
        
        @media (max-width: 500px) {
            .dpad-btn, .control-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            .dpad {
                grid-template-columns: 40px 40px 40px;
                grid-template-rows: 40px 40px 40px;
                gap: 3px;
            }
            #mobileControls {
                padding: 0 10px;
                bottom: 10px;
            }
        }
        
        @media (pointer: coarse) {
            #mobileControls.show {
                display: flex;
            }
        }
        
        /* Scrollbar hide */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

<div id="gameContainer" style="position: relative; display: inline-block;">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- UI Overlay -->
    <div id="ui" class="active">
        <div id="titleScreen">
            <div class="title">🚀 Cosmic Star Chaser</div>
            <div class="subtitle">🌟 An Exciting Space Adventure! 🌟</div>
            <div class="age-requirement">⚠️ For ages 10 and above</div>
            <button class="btn" onclick="showNameInput()">Start Adventure</button>
        </div>
        
        <div id="nameInput" class="hidden">
            <div class="title" style="font-size: clamp(24px, 4vw, 36px);">👨‍🚀 Welcome!</div>
            <div class="subtitle" style="font-size: clamp(14px, 2vw, 20px);">Please tell us about yourself!</div>
            <div class="age-requirement">⚠️ You must be 10 or older to play!</div>
            <br>
            <input type="text" id="playerName" class="input-box" placeholder="Your Name" maxlength="20" autocomplete="off">
            <br>
            <input type="number" id="playerAge" class="input-box" placeholder="Your Age" maxlength="2" min="1" max="99" inputmode="numeric">
            <br>
            <div id="ageError" class="error-text"></div>
            <br>
            <button class="btn" onclick="startGame()">🚀 Launch!</button>
            <br>
            <small style="color: #888; font-size: clamp(12px, 1.5vw, 16px);">Tap on a box to type</small>
        </div>
    </div>
    
    <!-- Game Over Overlay -->
    <div id="gameOver">
        <div id="gameOverTitle" class="game-over-title">💫 Game Over!</div>
        <div id="winTitle" class="win-title hidden">🏆 YOU WIN! 🏆</div>
        <div id="finalScore" class="final-score">Score: 0</div>
        <button class="btn" id="retryBtn" onclick="restartGame()">🔄 Play Again</button>
        <button class="btn hidden" id="mainMenuBtn" onclick="goToMainMenu()" style="background: linear-gradient(45deg, #66aaff, #3366ff); color: #fff;">🏠 Main Menu</button>
    </div>
    
    <!-- Mobile Controls -->
    <div id="mobileControls" class="show">
        <div class="dpad">
            <div class="dpad-empty"></div>
            <div class="dpad-btn" id="btnUp">▲</div>
            <div class="dpad-empty"></div>
            <div class="dpad-btn" id="btnLeft">◀</div>
            <div class="dpad-btn" id="btnDown">▼</div>
            <div class="dpad-btn" id="btnRight">▶</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <div class="control-btn" id="btnPause" style="width: 50px; height: 50px; font-size: 20px;">⏸</div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // COMPLETE GAME - Works on Mobile & Laptop
    // ============================================================
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 600;
    const MIN_AGE = 10;
    const MAX_LEVEL = 3;
    const STARS_PER_LEVEL = 5;
    
    // Game state
    let gameState = 'title';
    let playerName = '';
    let playerAge = '';
    let ageError = '';
    let score = 0;
    let totalScore = 0;
    let completedLevelScore = 0;
    let level = 1;
    let starsCollected = 0;
    let starsMissed = 0;
    let maxMisses = 10;
    let combo = 0;
    let maxCombo = 0;
    let gameOver = false;
    let paused = false;
    let message = '';
    let messageTimer = 0;
    let angle = 0;
    let frameCount = 0;
    
    // Rocket
    let rocket = { x: W/2, y: H-100, w: 40, h: 50, speed: 5, trail: [] };
    
    // Stars
    let stars = [];
    let spawnTimer = 0;
    let spawnInterval = 50;
    
    // Quiz
    let quizQuestions = [];
    let currentQuestion = 0;
    let quizScore = 0;
    let quizAnswered = false;
    let quizSelected = -1;
    let quizShowFact = false;
    let quizWaiting = false;
    let quizTimer = 0;
    let totalQuizQuestions = 3;
    
    // Background stars
    let bgStars = [];
    for (let i = 0; i < 100; i++) {
        bgStars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: 1 + Math.random() * 2,
            twinkle: Math.random() * 2 * Math.PI
        });
    }
    
    // Level themes — each level has its own name, background colors, and set of collectible
    // stars named after REAL stars, so kids learn actual astronomy while they play.
    const LEVEL_THEMES = {
        1: {
            name: 'Nearby Stars',
            bgTop: '#1a0a3a', bgMid: '#2d1b5e', bgBottom: '#1a0a3a',
            trophyStar: 'GOLD_STAR',
            starTypes: {
                'SPARKLE':   { color: '#fff066', radius: 20, points: 20, speed: 1.5, label: 'Proxima Centauri', emoji: '✨', fact: "Closest star to our Sun!" },
                'RAINBOW':   { color: '#ff8de0', radius: 18, points: 40, speed: 2,   label: 'Vega',             emoji: '🌈', fact: "One of the brightest stars!" },
                'GOLD_STAR': { color: '#ffd700', radius: 22, points: 60, speed: 1.8, label: 'Sirius',           emoji: '🌟', fact: "Brightest star in our night sky!" },
                'BUBBLE':    { color: '#7fe8ff', radius: 16, points: 80, speed: 2.5, label: 'Alpha Centauri',   emoji: '🫧', fact: "Nearest star system to us!" },
                'CLOUD':     { color: '#9a9aa8', radius: 26, points: -30, speed: 1,  label: 'Nebula',           emoji: '☁️', fact: "Gas & dust cloud, not a star!" }
            }
        },
        2: {
            name: 'Constellation Stars',
            bgTop: '#050a2e', bgMid: '#0d1a52', bgBottom: '#050a2e',
            trophyStar: 'UFO',
            starTypes: {
                'COMET':    { color: '#88ffcc', radius: 18, points: 30, speed: 2.2, label: 'Polaris',    emoji: '🧭', fact: "The North Star!" },
                'MOON':     { color: '#e8e8ff', radius: 22, points: 50, speed: 1.8, label: 'Betelgeuse', emoji: '🔴', fact: "Giant red star in Orion!" },
                'PLANET':   { color: '#ffb84d', radius: 24, points: 70, speed: 1.5, label: 'Rigel',      emoji: '🔵', fact: "Blue supergiant in Orion!" },
                'UFO':      { color: '#66ffcc', radius: 16, points: 110, speed: 3,  label: 'Antares',    emoji: '❤️', fact: "Heart of the Scorpius stars!" },
                'ASTEROID': { color: '#5c5c66', radius: 28, points: -40, speed: 1.2, label: 'Asteroid',  emoji: '🪨', fact: "Rocky object, not a star!" }
            }
        },
        3: {
            name: 'Giant Stars',
            bgTop: '#2a0a2a', bgMid: '#4d0d3d', bgBottom: '#2a0a2a',
            trophyStar: 'DIAMOND',
            starTypes: {
                'UNICORN':  { color: '#ff9de8', radius: 20, points: 40, speed: 2.5, label: 'Arcturus',  emoji: '🟠', fact: "Bright orange giant star!" },
                'CANDY':    { color: '#ff6699', radius: 18, points: 55, speed: 2.8, label: 'Aldebaran', emoji: '👁️', fact: "The fiery eye of Taurus!" },
                'DIAMOND':  { color: '#b3f0ff', radius: 16, points: 130, speed: 3.5, label: 'Canopus',  emoji: '💎', fact: "2nd-brightest star in our sky!" },
                'FIREWORK': { color: '#ffaa33', radius: 24, points: 90, speed: 2,   label: 'Deneb',     emoji: '🎆', fact: "A far-away supergiant star!" },
                'BLACKHOLE':{ color: '#000000', radius: 30, points: -50, speed: 1.4, label: 'Black Hole', emoji: '🕳️', fact: "Not even light escapes it!" }
            }
        }
    };

    function getLevelTheme() {
        return LEVEL_THEMES[Math.min(level, MAX_LEVEL)];
    }

    // Currently-completed level, captured at the moment a level finishes
    // (used so the "Level Complete" screen can describe the level that just ended,
    // since `level` itself gets incremented right away).
    let completedLevel = 1;
    
    const QUIZ_QUESTIONS = [
        { question: 'What is the closest star to Earth?', options: ['Alpha Centauri', 'The Sun', 'Proxima Centauri', 'Sirius'], correct: 1, fun_fact: 'The Sun is our closest star! 🌞' },
        { question: 'How many planets are in our solar system?', options: ['7', '8', '9', '10'], correct: 1, fun_fact: 'There are 8 planets! 🪐' },
        { question: 'What is the largest planet?', options: ['Saturn', 'Jupiter', 'Neptune', 'Earth'], correct: 1, fun_fact: 'Jupiter is the largest! 🌍' },
        { question: 'What is our galaxy called?', options: ['Andromeda', 'Milky Way', 'Sombrero', 'Whirlpool'], correct: 1, fun_fact: 'We live in the Milky Way! 🌌' },
        { question: 'Which planet is the Red Planet?', options: ['Venus', 'Mars', 'Jupiter', 'Mercury'], correct: 1, fun_fact: 'Mars is the Red Planet! 🔴' },
        { question: 'Which star is the brightest in Earth\'s night sky?', options: ['Polaris', 'Betelgeuse', 'Sirius', 'Vega'], correct: 2, fun_fact: 'Sirius outshines every other star we see at night! 🌟' },
        { question: 'What is Polaris also known as?', options: ['The Sun Star', 'The North Star', 'The Red Star', 'The Morning Star'], correct: 1, fun_fact: 'Polaris sits almost still in our sky, so sailors used it to find north! 🧭' },
        { question: 'What color are the coolest, oldest giant stars, like Betelgeuse?', options: ['Blue', 'White', 'Red', 'Green'], correct: 2, fun_fact: 'Cooler stars glow red, while hotter stars glow blue-white! 🔴' },
        { question: 'What happens if you get too close to a black hole?', options: ['Nothing at all', 'Not even light can escape', 'It turns into a star', 'It freezes you'], correct: 1, fun_fact: 'A black hole\'s gravity is so strong that not even light can escape! 🕳️' },
        { question: 'A nebula is best described as...', options: ['A tiny moon', 'A cloud of gas and dust', 'A type of planet', 'A fast comet'], correct: 1, fun_fact: 'Nebulae are the clouds where new stars are born! ☁️' }
    ];
    
    // Keys
    let keys = {};
    let touchX = null;
    let touchY = null;
    let isTouching = false;
    
    // ============================================================
    // INPUT HANDLING - Keyboard + Touch
    // ============================================================
    
    // Keyboard
    document.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (e.key === 'p' || e.key === 'P') {
            if (gameState === 'playing') paused = !paused;
        }
        if (e.key === 'Enter') {
            if (gameState === 'title') showNameInput();
            else if (gameState === 'nameInput') startGame();
            else if (gameState === 'levelComplete') startQuiz();
            else if (gameState === 'quiz' && quizWaiting) {
                quizWaiting = false;
                nextQuizQuestion();
            }
        }
        if (e.key === ' ' && (gameState === 'gameOver' || gameState === 'win')) {
            restartGame();
        }
    });
    document.addEventListener('keyup', (e) => { keys[e.key] = false; });
    
    // Touch / Mouse for rocket movement
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        const touch = e.touches[0];
        touchX = (touch.clientX - rect.left) * scaleX;
        touchY = (touch.clientY - rect.top) * scaleY;
        isTouching = true;
        
        // Check if clicking on quiz options (or tapping to advance after answering)
        if (gameState === 'quiz') {
            handleQuizClick(touchX, touchY);
        }
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        const touch = e.touches[0];
        touchX = (touch.clientX - rect.left) * scaleX;
        touchY = (touch.clientY - rect.top) * scaleY;
    }, { passive: false });
    
    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        isTouching = false;
    }, { passive: false });
    
    // Mouse for desktop
    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        
        if (gameState === 'quiz') {
            handleQuizClick(x, y);
        }
    });
    
    // Mobile controls (D-pad)
    const btnUp = document.getElementById('btnUp');
    const btnDown = document.getElementById('btnDown');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnPause = document.getElementById('btnPause');
    
    let mobileKeys = { up: false, down: false, left: false, right: false };
    
    function setupMobileButton(btn, key) {
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mobileKeys[key] = true;
        }, { passive: false });
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            mobileKeys[key] = false;
        }, { passive: false });
        btn.addEventListener('touchcancel', (e) => {
            mobileKeys[key] = false;
        });
        btn.addEventListener('mousedown', () => { mobileKeys[key] = true; });
        btn.addEventListener('mouseup', () => { mobileKeys[key] = false; });
        btn.addEventListener('mouseleave', () => { mobileKeys[key] = false; });
    }
    
    setupMobileButton(btnUp, 'up');
    setupMobileButton(btnDown, 'down');
    setupMobileButton(btnLeft, 'left');
    setupMobileButton(btnRight, 'right');
    
    btnPause.addEventListener('click', () => {
        if (gameState === 'playing') paused = !paused;
    });
    
    // ============================================================
    // UI FUNCTIONS
    // ============================================================
    
    function showNameInput() {
        document.getElementById('titleScreen').classList.add('hidden');
        document.getElementById('nameInput').classList.remove('hidden');
        gameState = 'nameInput';
        document.getElementById('playerName').focus();
    }
    
    function startGame() {
        const nameInput = document.getElementById('playerName');
        const ageInput = document.getElementById('playerAge');
        const errorDiv = document.getElementById('ageError');
        
        playerName = nameInput.value.trim();
        playerAge = ageInput.value.trim();
        
        if (!playerName) {
            errorDiv.textContent = 'Please enter your name!';
            nameInput.classList.add('error');
            nameInput.focus();
            return;
        }
        nameInput.classList.remove('error');
        
        if (!playerAge) {
            errorDiv.textContent = 'Please enter your age!';
            ageInput.classList.add('error');
            ageInput.focus();
            return;
        }
        
        const age = parseInt(playerAge);
        if (isNaN(age) || age < MIN_AGE) {
            errorDiv.textContent = `Sorry! You must be ${MIN_AGE} or older to play! 🚀`;
            ageInput.classList.add('error');
            ageInput.focus();
            return;
        }
        if (age > 99) {
            errorDiv.textContent = 'Please enter a valid age (10-99)!';
            ageInput.classList.add('error');
            ageInput.focus();
            return;
        }
        
        ageInput.classList.remove('error');
        errorDiv.textContent = '';
        
        document.getElementById('ui').classList.remove('active');
        document.getElementById('ui').classList.add('hidden');
        document.getElementById('gameOver').classList.remove('show');
        document.getElementById('mobileControls').classList.add('show');
        gameState = 'playing';
        totalScore = 0;
        resetGame();
    }
    
    function restartGame() {
        document.getElementById('gameOver').classList.remove('show');
        document.getElementById('mobileControls').classList.remove('show');

        if (gameState === 'gameOver') {
            // Lost on this level: retry the SAME level, don't reset progress back to Level 1.
            document.getElementById('ui').classList.add('hidden');
            document.getElementById('ui').classList.remove('active');
            gameState = 'playing';
            resetGame(); // resets score/stars/misses but leaves `level` untouched
            document.getElementById('mobileControls').classList.add('show');
        } else {
            // Finished all levels (full win): start over from Level 1.
            document.getElementById('ui').classList.remove('hidden');
            document.getElementById('ui').classList.add('active');
            document.getElementById('titleScreen').classList.remove('hidden');
            document.getElementById('nameInput').classList.add('hidden');
            gameState = 'title';
            level = 1;
            totalScore = 0;
            resetGame();
        }
    }

    function goToMainMenu() {
        document.getElementById('gameOver').classList.remove('show');
        document.getElementById('mobileControls').classList.remove('show');
        document.getElementById('ui').classList.remove('hidden');
        document.getElementById('ui').classList.add('active');
        document.getElementById('titleScreen').classList.remove('hidden');
        document.getElementById('nameInput').classList.add('hidden');
        gameState = 'title';
        level = 1;
        totalScore = 0;
        resetGame();
    }
    
    function showGameOver(win = false) {
        document.getElementById('gameOver').classList.add('show');
        document.getElementById('gameOverTitle').classList.toggle('hidden', win);
        document.getElementById('winTitle').classList.toggle('hidden', !win);
        document.getElementById('finalScore').textContent = `Final Score: ${win ? totalScore : score}`;

        const retryBtn = document.getElementById('retryBtn');
        const mainMenuBtn = document.getElementById('mainMenuBtn');

        if (win) {
            document.getElementById('gameOverTitle').textContent = `💫 Game Over!`;
            retryBtn.textContent = '🔄 Play Again from Start';
            mainMenuBtn.classList.add('hidden');
        } else {
            document.getElementById('gameOverTitle').textContent = `💫 Game Over! (${getLevelTheme().name})`;
            retryBtn.textContent = `🔄 Try Level ${level} Again`;
            mainMenuBtn.classList.remove('hidden');
        }

        gameState = win ? 'win' : 'gameOver';
        document.getElementById('mobileControls').classList.remove('show');
    }
    
    // ============================================================
    // GAME FUNCTIONS
    // ============================================================
    
    function resetGame() {
        rocket = { x: W/2, y: H-100, w: 40, h: 50, speed: 5, trail: [] };
        stars = [];
        score = 0;
        starsCollected = 0;
        starsMissed = 0;
        gameOver = false;
        paused = false;
        combo = 0;
        maxCombo = 0;
        spawnTimer = 0;
        message = '';
        messageTimer = 0;
        for (let i = 0; i < 3; i++) spawnStar();
    }
    
    function spawnStar() {
        if (stars.length < 20) {
            const starTypes = getLevelTheme().starTypes;
            const types = Object.keys(starTypes);
            const type = types[Math.floor(Math.random() * types.length)];
            const props = starTypes[type];
            stars.push({
                type: type,
                props: props,
                x: props.radius + 20 + Math.random() * (W - props.radius * 2 - 40),
                y: -props.radius,
                speed: props.speed + (Math.random() - 0.5),
                points: props.points,
                radius: props.radius,
                emoji: props.emoji,
                label: props.label,
                fact: props.fact
            });
        }
    }
    
    function showMessage(text, duration = 60) {
        message = text;
        messageTimer = duration;
    }
    
    function handleCollision(star) {
        const r = rocket;
        const dx = r.x - star.x;
        const dy = r.y - star.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < r.w/2 + star.radius) {
            if (star.points < 0) {
                combo = 0;
                score += star.points;
                showMessage(`⚠️ ${star.label}! ${star.fact}`, 100);
            } else {
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                let bonus = 0;
                if (combo >= 5) bonus = 20;
                else if (combo >= 3) bonus = 10;
                const total = star.points + bonus;
                score += total;
                starsCollected++;
                showMessage(`⭐ +${total} ${star.label}! ${star.fact}`, 100);
            }
            return true;
        }
        
        if (star.y > H + star.radius * 2) {
            starsMissed++;
            combo = 0;
            return true;
        }
        return false;
    }
    
    function getRocketInput() {
        let dx = 0, dy = 0;
        
        // Keyboard
        if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= rocket.speed;
        if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += rocket.speed;
        if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= rocket.speed;
        if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += rocket.speed;
        
        // Mobile D-pad
        if (mobileKeys.left) dx -= rocket.speed;
        if (mobileKeys.right) dx += rocket.speed;
        if (mobileKeys.up) dy -= rocket.speed;
        if (mobileKeys.down) dy += rocket.speed;
        
        // Touch drag
        if (isTouching && touchX !== null && touchY !== null) {
            const dxTouch = touchX - rocket.x;
            const dyTouch = touchY - rocket.y;
            const dist = Math.sqrt(dxTouch*dxTouch + dyTouch*dyTouch);
            if (dist > 10) {
                const speed = Math.min(rocket.speed, dist / 10);
                dx += (dxTouch / dist) * speed;
                dy += (dyTouch / dist) * speed;
            }
        }
        
        return { dx, dy };
    }
    
    function updateGame() {
        if (gameState !== 'playing' || gameOver || paused) return;
        
        frameCount++;
        
        // Rocket movement
        const { dx, dy } = getRocketInput();
        rocket.x += dx;
        rocket.y += dy;
        rocket.x = Math.max(rocket.w/2 + 10, Math.min(W - rocket.w/2 - 10, rocket.x));
        rocket.y = Math.max(rocket.h/2 + 10, Math.min(H - rocket.h/2 - 10, rocket.y));
        
        // Trail
        if (frameCount % 2 === 0) {
            rocket.trail.push({x: rocket.x, y: rocket.y});
            if (rocket.trail.length > 25) rocket.trail.shift();
        }
        
        // Spawn stars
        spawnTimer++;
        const rate = Math.max(15, spawnInterval - level * 3);
        if (spawnTimer >= rate) {
            spawnStar();
            spawnTimer = 0;
            if (Math.random() < 0.2 && stars.length < 15) spawnStar();
        }
        
        // Update stars
        for (let i = stars.length - 1; i >= 0; i--) {
            const star = stars[i];
            star.y += star.speed;
            
            if (handleCollision(star)) {
                stars.splice(i, 1);
            }
        }

        // Check game-over condition once per frame (not per-star), and only fire it once.
        if (!gameOver && starsMissed >= maxMisses) {
            gameOver = true;
            showMessage('💫 Game Over!', 9999);
            setTimeout(() => showGameOver(false), 1500);
        }
        
        // Level up
        if (starsCollected >= STARS_PER_LEVEL * level) {
            gameState = 'levelComplete';
            completedLevel = level;
            completedLevelScore = score;
            totalScore += score;
            showMessage('🎉 Level Complete!', 9999);
            level++;
            setTimeout(() => {
                if (level > MAX_LEVEL) {
                    showGameOver(true);
                } else {
                    startQuiz();
                }
            }, 2000);
        }
        
        if (messageTimer > 0) messageTimer--;
        
        // Background stars
        for (let star of bgStars) {
            star.twinkle += 0.03;
        }
    }
    
    // ============================================================
    // QUIZ FUNCTIONS
    // ============================================================
    
    function startQuiz() {
        gameState = 'quiz';
        quizQuestions = [...QUIZ_QUESTIONS];
        shuffleArray(quizQuestions);
        currentQuestion = 0;
        quizScore = 0;
        quizAnswered = false;
        quizSelected = -1;
        quizShowFact = false;
        quizWaiting = false;
        document.getElementById('mobileControls').classList.remove('show');
    }
    
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }
    
    function nextQuizQuestion() {
        currentQuestion++;
        quizAnswered = false;
        quizSelected = -1;
        quizShowFact = false;
        if (currentQuestion >= totalQuizQuestions) {
            gameState = 'playing';
            document.getElementById('mobileControls').classList.add('show');
            resetGame();
        }
    }
    
    function handleQuizClick(mx, my) {
        if (currentQuestion >= totalQuizQuestions) return;

        // If we're already showing the answer, any tap/click advances to the next question.
        // (Mobile players have no keyboard for "Enter", so this is their only way to continue.)
        if (quizWaiting) {
            quizWaiting = false;
            nextQuizQuestion();
            return;
        }
        if (quizAnswered) return;

        const q = quizQuestions[currentQuestion];
        if (!q) return;
        
        for (let i = 0; i < 4; i++) {
            const x = W/2 - 250;
            const y = 280 + i * 60;
            const w = 500, h = 50;
            if (mx >= x && mx <= x + w && my >= y && my <= y + h) {
                quizSelected = i;
                quizAnswered = true;
                if (i === q.correct) quizScore += 10;
                quizShowFact = true;
                quizWaiting = true;
                quizTimer = 120;
                break;
            }
        }
    }
    
    // ============================================================
    // DRAWING FUNCTIONS
    // ============================================================
    
    function drawBackground() {
        const theme = getLevelTheme();
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, theme.bgTop);
        grad.addColorStop(0.5, theme.bgMid);
        grad.addColorStop(1, theme.bgBottom);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        
        for (let star of bgStars) {
            const brightness = 100 + 155 * Math.sin(star.twinkle);
            ctx.fillStyle = `rgb(${brightness}, ${brightness}, ${brightness})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    function drawRocket() {
        const r = rocket;
        
        // Trail
        for (let i = 0; i < r.trail.length; i++) {
            const alpha = i / r.trail.length * 0.6;
            const size = 3 + (i / r.trail.length) * 5;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#3399ff';
            ctx.beginPath();
            ctx.arc(r.trail[i].x, r.trail[i].y, size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        
        // Rocket body
        ctx.fillStyle = '#dcdcdc';
        ctx.strokeStyle = '#b0b0b0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(r.x, r.y - r.h/2);
        ctx.lineTo(r.x - r.w/2, r.y + r.h/2);
        ctx.lineTo(r.x + r.w/2, r.y + r.h/2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Window
        ctx.fillStyle = '#add8e6';
        ctx.strokeStyle = '#4444aa';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(r.x, r.y - 5, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        // Window shine
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(r.x - 4, r.y - 9, 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Flames
        const flameH = 15 + Math.random() * 10;
        ctx.fillStyle = '#ff8c00';
        ctx.beginPath();
        ctx.moveTo(r.x - 12, r.y + r.h/2);
        ctx.lineTo(r.x, r.y + r.h/2 + flameH);
        ctx.lineTo(r.x + 12, r.y + r.h/2);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.moveTo(r.x - 6, r.y + r.h/2);
        ctx.lineTo(r.x, r.y + r.h/2 + flameH/2 + Math.random() * 5);
        ctx.lineTo(r.x + 6, r.y + r.h/2);
        ctx.closePath();
        ctx.fill();
        
        // Cute face
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(r.x - 8, r.y - 8, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(r.x + 8, r.y - 8, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4444aa';
        ctx.beginPath();
        ctx.arc(r.x - 8, r.y - 8, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(r.x + 8, r.y - 8, 2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(r.x, r.y - 2, 10, 0.1, Math.PI - 0.1);
        ctx.stroke();
    }
    
    function drawStars() {
        for (let star of stars) {
            // Glow
            const grad = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, star.radius * 2);
            const color = star.props.color;
            grad.addColorStop(0, color + '40');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius * 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Star body
            ctx.fillStyle = star.props.color;
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Emoji
            ctx.font = `${star.radius * 1.2}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white';
            ctx.fillText(star.emoji, star.x, star.y);
            
            // Label
            ctx.font = '12px Arial';
            ctx.fillStyle = 'white';
            ctx.textBaseline = 'bottom';
            ctx.fillText(star.label, star.x, star.y + star.radius + 15);
            
            // Points
            ctx.font = '12px Arial';
            ctx.fillStyle = star.points > 0 ? '#32ff32' : '#ff3232';
            ctx.textBaseline = 'bottom';
            ctx.fillText((star.points > 0 ? '+' : '') + star.points, star.x, star.y + star.radius + 30);
        }
    }
    
    function drawUI() {
        // Score
        ctx.font = 'bold 48px Arial';
        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(`Score: ${score}`, 10, 10);
        
        // Level
        ctx.font = '32px Arial';
        ctx.fillStyle = '#add8e6';
        ctx.fillText(`Level ${level}/${MAX_LEVEL}: ${getLevelTheme().name}`, 10, 65);
        
        // Stars collected/missed
        ctx.font = '24px Arial';
        ctx.fillStyle = '#32ff32';
        ctx.fillText(`⭐ ${starsCollected}/${STARS_PER_LEVEL * level}`, 10, 110);
        ctx.fillStyle = '#ff3232';
        ctx.fillText(`💫 ${starsMissed}/${maxMisses}`, 10, 140);
        
        // Combo
        if (combo >= 2) {
            ctx.font = 'bold 32px Arial';
            ctx.fillStyle = '#ffff00';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(`🔥 ${combo}x Combo!`, W/2, 10);
        }
        
        // Player name
        if (playerName) {
            ctx.font = '24px Arial';
            ctx.fillStyle = '#00ffff';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.fillText(`👨‍🚀 ${playerName}`, W - 20, 10);
            ctx.fillText(`Age: ${playerAge}`, W - 20, 40);
        }
        
        // Controls hint (desktop only)
        if (!('ontouchstart' in window)) {
            ctx.font = '20px Arial';
            ctx.fillStyle = '#808080';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('⬆⬇⬅➡/WASD | P:Pause', W/2, H - 10);
        }
        
        // Message
        if (message && messageTimer > 0) {
            ctx.font = message.length > 28 ? '22px Arial' : '32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const metrics = ctx.measureText(message);
            const tw = metrics.width;
            const th = 40;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(W/2 - tw/2 - 20, 90, tw + 40, th + 20);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.strokeRect(W/2 - tw/2 - 20, 90, tw + 40, th + 20);
            ctx.fillStyle = 'white';
            ctx.fillText(message, W/2, 110);
        }
        
        // Pause overlay
        if (paused && !gameOver && gameState === 'playing') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, W, H);
            ctx.font = 'bold 64px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⏸ PAUSED', W/2, H/2 - 20);
            ctx.font = '28px Arial';
            ctx.fillText('Press P to resume', W/2, H/2 + 60);
        }
    }
    
    function drawQuiz() {
        drawBackground();
        
        ctx.font = 'bold 48px Arial';
        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('🌟 Space Quiz! 🌟', W/2, 10);
        
        ctx.font = '32px Arial';
        ctx.fillStyle = '#00ffff';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(`Score: ${quizScore}`, 20, 20);
        
        if (currentQuestion < totalQuizQuestions) {
            const q = quizQuestions[currentQuestion];
            if (!q) return;
            
            ctx.font = '32px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`❓ ${q.question}`, W/2, 120);
            
            const letters = ['A', 'B', 'C', 'D'];
            for (let i = 0; i < 4; i++) {
                const x = W/2 - 250;
                const y = 280 + i * 60;
                const w = 500, h = 50;
                
                let color = 'white';
                if (quizAnswered) {
                    if (i === q.correct) color = '#32ff32';
                    else if (i === quizSelected && i !== q.correct) color = '#ff3232';
                } else if (i === quizSelected) color = '#ffff00';
                
                ctx.fillStyle = 'rgba(50,50,100,0.8)';
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.fillRect(x, y, w, h);
                ctx.strokeRect(x, y, w, h);
                
                ctx.font = '28px Arial';
                ctx.fillStyle = color;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${letters[i]}. ${q.options[i]}`, x + 20, y + 25);
            }
            
            if (quizShowFact) {
                const fact = `💡 ${q.fun_fact}`;
                ctx.font = '22px Arial';
                ctx.fillStyle = '#00ffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const metrics = ctx.measureText(fact);
                const tw = metrics.width;
                ctx.fillStyle = 'rgba(0,0,50,0.8)';
                ctx.fillRect(W/2 - tw/2 - 20, 555, tw + 40, 40);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(W/2 - tw/2 - 20, 555, tw + 40, 40);
                ctx.fillStyle = '#00ffff';
                ctx.fillText(fact, W/2, 575);
            }

            if (quizWaiting) {
                ctx.font = 'bold 20px Arial';
                ctx.fillStyle = '#ffff00';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('👆 Tap anywhere (or press Enter) to continue', W/2, 245);
            }
        }
    }
    
    function drawLevelComplete() {
        drawBackground();
        
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);

        // Little celebratory sparkle burst
        for (let i = 0; i < 12; i++) {
            const x = Math.random() * W;
            const y = Math.random() * H;
            const colors = ['#ffd700', '#ffff00', '#00ffff', '#ff69b4', '#32ff32'];
            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
            ctx.beginPath();
            ctx.arc(x, y, 2 + Math.random() * 4, 0, Math.PI * 2);
            ctx.fill();
        }

        const theme = LEVEL_THEMES[completedLevel];
        const trophy = theme.starTypes[theme.trophyStar];
        
        ctx.font = 'bold 52px Arial';
        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`🎉 You Won ${theme.name}! 🎉`, W/2, 150);
        
        ctx.font = '32px Arial';
        ctx.fillStyle = 'white';
        ctx.fillText(`🌟 Score: ${completedLevelScore}`, W/2, 240);
        ctx.fillText(`⭐ Stars: ${starsCollected}`, W/2, 285);

        ctx.font = 'bold 28px Arial';
        ctx.fillStyle = trophy.color === '#000000' ? '#ffffff' : trophy.color;
        ctx.fillText(`${trophy.emoji} You earned the ${trophy.label} Trophy! ${trophy.emoji}`, W/2, 345);

        ctx.font = '24px Arial';
        ctx.fillStyle = '#00ffff';
        ctx.fillText('📚 Time for a space quiz!', W/2, 410);
    }
    
    function drawWin() {
        drawBackground();
        
        // Celebration particles
        for (let i = 0; i < 15; i++) {
            const x = Math.random() * W;
            const y = Math.random() * H;
            const colors = ['#ffd700', '#ffff00', '#00ffff', '#ff69b4', '#32ff32', '#ff4500'];
            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
            ctx.beginPath();
            ctx.arc(x, y, 3 + Math.random() * 5, 0, Math.PI * 2);
            ctx.fill();
        }
        
        ctx.font = 'bold 56px Arial';
        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🏆 YOU WIN! 🏆', W/2, 130);
        
        ctx.font = '32px Arial';
        ctx.fillStyle = '#00ffff';
        ctx.fillText(`Congratulations ${playerName}! 🌟`, W/2, 200);
        
        ctx.font = '28px Arial';
        ctx.fillStyle = 'white';
        ctx.fillText(`⭐ Final Score: ${totalScore}`, W/2, 280);
        ctx.fillText('🚀 You\'re a true Space Explorer!', W/2, 330);
        ctx.fillText('🌟 You\'ve mastered the stellar lifecycle!', W/2, 380);
    }
    
    // ============================================================
    // MAIN GAME LOOP
    // ============================================================
    
    function gameLoop() {
        // Update
        if (gameState === 'playing') {
            updateGame();
        }
        
        // Draw
        ctx.clearRect(0, 0, W, H);
        
        if (gameState === 'title' || gameState === 'nameInput') {
            drawBackground();
        } else if (gameState === 'playing') {
            drawBackground();
            drawStars();
            drawRocket();
            drawUI();
        } else if (gameState === 'levelComplete') {
            drawLevelComplete();
        } else if (gameState === 'quiz') {
            drawQuiz();
        } else if (gameState === 'win') {
            drawWin();
        } else if (gameState === 'gameOver') {
            drawBackground();
            drawStars();
            drawRocket();
            drawUI();
        }
        
        angle += 0.02;
        requestAnimationFrame(gameLoop);
    }
    
    // Start the game loop
    gameLoop();
</script>
